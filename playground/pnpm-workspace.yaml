# Security: force patched transitive deps (Dependabot)
overrides:
  glob@>=9 <14.0.2: ^14.0.2
  minimatch@>=7 <11.0.1: ^11.0.1

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

onlyBuiltDependencies:
  - better-sqlite3
