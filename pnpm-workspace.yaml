shamefullyHoist: true
strictPeerDependencies: false

# Security: force patched transitive deps (Dependabot)
overrides:
  glob@>=9 <14.0.2: ^14.0.2
  minimatch@>=7 <11.0.1: ^11.0.1

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@vue/language-core@3.3.2"
  - vue-tsc@3.3.2
  - "@oxfmt/*"
  - "@oxlint/*"
  - oxfmt@0.52.0
  - oxlint@1.67.0
